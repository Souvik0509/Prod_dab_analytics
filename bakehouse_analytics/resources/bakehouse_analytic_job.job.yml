# A sample job for bakehouse_analytics.

resources:
  jobs:
    bakehouse_analytic_job:
      name: bakehouse_analytic_job

      trigger:
        # Run this job every day, exactly one day from the last run; see https://docs.databricks.com/api/workspace/jobs/create#trigger
        periodic:
          interval: 1
          unit: DAYS

      #email_notifications:
      #  on_failure:
      #    - your_email@example.com

      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
      tasks:
        - task_key: customer_info
          notebook_task:
            notebook_path: ../src/bakehouse_customer.ipynb
        - task_key: customer_transaction
          depends_on:
            - task_key: customer_info
          notebook_task:
            notebook_path: ../src/bakehouse_transaction.ipynb
        - task_key: customer_suppliers
          depends_on:
            - task_key: customer_transaction
          notebook_task:
            notebook_path: ../src/bakehouse_suppliers.ipynb


      environments:
        - environment_key: default
          spec:
            environment_version: "5"
