# This is a Declarative Automation Bundle definition for bakehouse_analytics.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: bakehouse_analytics
  uuid: bc72dd5c-31c7-48e6-9838-86b1f17f5a3b

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    presets:
      name_prefix: dev_

    default: true
    workspace:
      host: https://dbc-8d3ec7ee-fa37.cloud.databricks.com
    variables:
      catalog: dev_bakehouse_analytics
      schema: rmd
  prod:
    mode: production
    presets:
      name_prefix: prod_
    workspace:
      host: https://dbc-8d3ec7ee-fa37.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/souviksarkar1000@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/souviksarkar1000@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: prod_bakehouse_analytics
      schema: rmd
    permissions:
      - user_name: souviksarkar1000@gmail.com
        level: CAN_MANAGE
